# LANDBARK POS — รันบน VPS
#
#   docker compose up -d
#
# ไม่ได้ build บนเครื่องนี้ — image ถูก build ไว้แล้วบนเครื่องของ GitHub
# (ดู .github/workflows/deploy.yml) เพราะ next build กิน RAM ~1.7 GB
# ส่วนตอนเสิร์ฟจริงใช้แค่ ~126 MB
#
# Caddy ขอใบ HTTPS จาก Let's Encrypt ให้เองตอนขึ้นครั้งแรก ไม่ต้องตั้งอะไรเพิ่ม
# ขอแค่ DNS ของโดเมนชี้มาที่ IP เครื่องนี้แล้ว และพอร์ต 80/443 เปิดอยู่
#
# ไฟล์นี้ใช้ได้ตอนเครื่องมี "เว็บเดียว" เท่านั้น เพราะถือพอร์ต 443 ไว้เอง
# จะเพิ่มเว็บตัวอื่นเข้าเครื่องเดียวกัน ต้องยก Caddy ออกไปไว้ข้างนอกก่อน
# — ดูหัวข้อ 12 ใน docs/deploy-vps.md

services:
  app:
    # ตอน deploy ตัว workflow จะส่ง APP_IMAGE เป็น tag ของ commit นั้นมาให้
    # ไม่พึ่ง :latest เพราะถ้า deploy ซ้อนกันจะไม่รู้ว่ากำลังรันโค้ดตัวไหนอยู่
    image: ${APP_IMAGE:-ghcr.io/landbark/lb.pos:latest}
    # ความลับที่อ่านตอนรัน (service role key, token ต่างๆ) มาจากไฟล์ .env
    # ส่วน NEXT_PUBLIC_* ถูกฝังลงบันเดิลไปตั้งแต่ตอน build แล้ว ใส่ตรงนี้ไม่มีผล
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ใบรับรองอยู่ใน volume — ไม่งั้นรีสตาร์ททีขอใหม่ที แล้วโดน Let's Encrypt จำกัดจำนวน
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
