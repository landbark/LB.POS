# build image บนเครื่องของ GitHub แล้วให้ VPS แค่ดึงไปรัน
#
# ทำแบบนี้เพราะ next build กิน RAM ~1.7 GB แต่ตอนเสิร์ฟจริงใช้แค่ ~126 MB
# ถ้า build บน VPS ต้องซื้อเครื่อง 2 GB และร้านจะสะดุดทุกครั้งที่ deploy
# แยก build ออกมาแล้ว VPS 1 GB ก็เหลือเฟือ

name: Deploy

on:
  push:
    branches: [main]
  # กดรันเองได้จากแท็บ Actions เผื่อต้อง deploy ซ้ำโดยไม่มีโค้ดใหม่
  workflow_dispatch:

# ห้าม deploy ซ้อนกัน — กันกรณี push รัวแล้วตัวเก่าไปทับตัวใหม่
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: ตรวจโค้ด
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: build image
    needs: check
    # สวิตช์เปิดการย้าย — ตราบใดที่ยังไม่ตั้ง จะรันแค่ job ตรวจโค้ดข้างบน
    # เปิดเมื่อพร้อมจริงที่ repo → Settings → Secrets and variables → Actions
    #   → แท็บ Variables → New variable: VPS_ENABLED = true
    if: vars.VPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # ชื่อ image ต้องเป็นตัวพิมพ์เล็กทั้งหมด แต่ชื่อ repo เป็น LB.POS
      - id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # เก็บ cache ไว้ที่ GitHub — รอบถัดไป build เฉพาะส่วนที่เปลี่ยน
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_LIFF_ID=${{ secrets.NEXT_PUBLIC_LIFF_ID }}
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    name: ส่งขึ้น VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ssh เข้าเครื่องแล้วสลับไปใช้ image ใหม่
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ needs.build.outputs.image }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$USER@$HOST" bash -se <<EOF
            set -euo pipefail
            cd ~/LB.POS
            # ดึง compose/Caddyfile รุ่นล่าสุดมาด้วย เผื่อไฟล์ตั้งค่าเปลี่ยน
            git pull --ff-only
            # ยึด tag เป็น commit ที่ build มาจริง ไม่พึ่ง latest ที่อาจคาบเกี่ยวกัน
            export APP_IMAGE="$IMAGE:$SHA"
            docker compose pull app
            docker compose up -d
            # ลบ image เก่าที่ไม่มีใครใช้ ไม่งั้นดิสก์ 25 GB เต็มใน 2 เดือน
            docker image prune -f
          EOF

      - name: เช็คว่าเว็บกลับมาแล้วจริง
        env:
          SITE: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/login" || true)
            if [ "$code" = "200" ]; then echo "เว็บตอบ 200 แล้ว"; exit 0; fi
            echo "ยังไม่พร้อม (ได้ $code) รออีก 5 วิ..."
            sleep 5
          done
          echo "::error::deploy แล้วแต่ /login ไม่ตอบ 200 — เข้าไปดู docker compose logs บน VPS"
          exit 1
